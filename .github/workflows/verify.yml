name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'setuptools<81' 'online-judge-verify-helper==5.6.0'
      - uses: actions/cache@v4
        with:
          path: |
            .verify-helper/cache
            ~/.cache/online-judge-tools
          key: verification-data-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: verification-data-v1-${{ runner.os }}-
      - name: Verify
        run: oj-verify run -j 2
      - name: Generate documentation
        run: oj-verify docs -j 2
      - uses: actions/upload-artifact@v4
        with:
          name: library-documentation
          path: .verify-helper/markdown
          include-hidden-files: true

  build-pages:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: library-documentation
          path: docs
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: _site
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
